# PerpX Load Test - Localnet Configuration
# Use with: perpx-load-test seed --config config/config-localnet.yaml
# Or: ./scripts/run_benchmark.sh --config config/config-localnet.yaml
#
# Standard localnet (`perpx-chain/deployment/localnet`)
# - RPC:  http://localhost:36657
# - WS:   ws://localhost:36657/websocket
# - REST: http://localhost:31317
# - gRPC: http://localhost:39090 (maps to container :9090)

version: "1"

seed:
  workers: 500
  seedKey: ""
  # Optional: hex-encoded private key for seeding. If set, overrides seedKey.
  seedPrivateKey: ""
  rpc: http://localhost:36657
  # REST base URL for balance/account queries (required for seed balance check).
  # In the localnet stack, REST is exposed on localhost:31317.
  restUrl: http://localhost:31317
  # gRPC endpoint used for broadcasting seed transactions (host:port).
  # In the localnet stack, gRPC is exposed on localhost:39090.
  grpc: http://localhost:39090
  chainId: localperpxprotocol
  denom: aperpx
  fundAmount: "1000000000000000000aperpx"
  batchSize: 200
  mode: perps
  perpsDeposit: "10000000000"
  perpsDepositDenom: usdc

loadtest:
  clientFactory: perpx-perps
  # REST base URL for account/sequence queries and optional tx status checks.
  # In the localnet stack, REST is exposed on localhost:31317.
  restUrl: http://localhost:31317
  connections: 25
  time: 30
  sendPeriod: 1
  rate: 2
  count: -1
  broadcastTxMethod: sync
  # Explicit chain context for the bank/perps clients. If unset, code falls
  # back to LOADTEST_CHAIN_ID / LOADTEST_DENOM env vars (which default to
  # these same values for localnet).
  chainId: localperpxprotocol
  denom: aperpx
  endpoints:
    - ws://localhost:36657/websocket
  ui: plain
  statsOutputFile: ""

  perps:
    # Scenario + sizing (YAML equivalents of many LOADTEST_PERPS_* env vars)
    scenario: maker_taker
    # Format: "clobPairID:symbol:minQty-maxQty:minSubticks-maxSubticks"
    # Quantities are chosen to be clean multiples of the CLOB pair's
    # StepBaseQuantums (1,000,000) to avoid code=12 "Order Quantums must be
    # a multiple of the ClobPair's StepBaseQuantums" errors.
    # minQty-maxQty: force exactly 1,000,000 quantums (StepBaseQuantums=1,000,000)
    # to minimize per-order notional and NewlyUndercollateralized (code=3007) events.
    markets: "1:ETH-USD:1000000-1000000:100000-200000"
    # Stronger bias toward cancel/close to keep risk bounded.
    # place,cancel,amend,close,noop
    actionWeights: "75,0,0,25,0"
    maxTrackedOrders: 20
    # Narrower leverage window to keep effective risk lower.
    minLeverage: "1.0"
    maxLeverage: "2.0"
    useMidPrice: false

    # Client behavior
    deterministicClientIds: false
    # Use timestamp nonces to avoid account-sequence contention at high concurrency (code=32).
    useTimestampNonce: true

    # Tx monitoring (off by default)
    monitorTxStatus: false
    txMonitorSampleRate: 0

    # Retry / margin check knobs (optional)
    maxRetries: 3
    retryDelayMs: 100
    enableMarginCheck: false
    minMarginRatio: "1.0"
    onInsufficientMargin: "skip"

    # Fee configuration for the perps client.
    feeGasLimit: 250000
    feeMinGasPrice: "25000000000"     # aperpx per gas
    feeAltDenom: "ibc/8E27BA2D5493AF5636760E354E46004562C46AB7EC0CC4C1CA14E9E20E2545B5"
    feeAltMinGasPrice: "25000"        # USDC quantums per gas
